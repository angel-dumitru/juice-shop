name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scans:
    name: Execute DevSecOps Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 1. Secrets Scanning (Gitleaks)
      - name: Secrets Scan (Gitleaks)
        run: |
          docker run --rm -v "$(pwd):/path" zricethezav/gitleaks:latest detect --source="/path" --report-format json --report-path /path/gitleaks_results.json || true

      # 2. Static Application Security Testing (SAST)
      - name: SAST Scan (Semgrep)
        run: |
          docker run --rm -v "$(pwd):/src" returntocorp/semgrep semgrep scan --config=auto --json -o /src/sast_results.json || true

      # 3. Software Composition Analysis (SCA)
      - name: SCA Scan (Trivy)
        run: |
          docker run --rm -v "$(pwd):/root/src" aquasec/trivy fs /root/src --format json -o /root/src/sca_results.json || true

      # 4. Software Bill of Materials (SBOM) - Uses npx to bypass global npm install issues
      - name: Generate SBOM (CycloneDX)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json || true

      # 5. Dynamic Application Security Testing (DAST)
      - name: Run Juice Shop Container
        run: docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop

      - name: Wait for App to Start
        run: sleep 20

      # Explicit path formatting for ZAP baseline scan output
      - name: DAST Scan (OWASP ZAP)
        run: |
          docker run --rm --network="host" -v "$(pwd):/zap/wrk/:rw" zaproxy/zap-stable zap-baseline.py -t http://localhost:3000 -J /zap/wrk/dast_results.json -r /zap/wrk/dast_report.html || true

      # Ensure permissions allow artifact upload action to read all generated files
      - name: Adjust Report File Permissions
        run: sudo chmod -R 777 .

      # 6. Save All 5 Artifacts for Submission
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-scan-reports
          path: |
            gitleaks_results.json
            sast_results.json
            sca_results.json
            sbom.json
            dast_results.json
          if-no-files-found: warn